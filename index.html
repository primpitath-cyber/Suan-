      <!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>สวนพร้อม - ระบบจัดการร้านต้นกล้า</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #2d6a4f;
      --primary-light: #52b788;
      --accent: #d8f3dc;
      --bg: #f4f6f0;
      --card: #ffffff;
      --text: #1b4332;
      --danger: #d90429;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); margin: 0; padding: 16px; font-size: 16px; }
    .container { max-width: 820px; margin: 0 auto; }
    h1 { color: var(--primary); text-align: center; margin-bottom: 20px; font-size: 26px; }
    h2 { font-size: 18px; margin-top: 0; padding-bottom: 8px; border-bottom: 2px solid var(--accent); color: var(--primary); }
    .card { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.04); }
    .form-group { margin-bottom: 14px; }
    .form-row { display: flex; gap: 12px; margin-bottom: 14px; }
    .form-row .form-group { flex: 1; margin-bottom: 0; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 15px; }
    input, select { width: 100%; padding: 12px; border: 1.5px solid #ced4da; border-radius: 10px; font-size: 16px; outline: none; }
    input:focus, select:focus { border-color: var(--primary); }
    .btn { width: 100%; background: var(--primary); color: #fff; border: none; padding: 14px; font-size: 17px; font-weight: bold; border-radius: 10px; cursor: pointer; }
    .btn:active { background: #1b4332; transform: scale(0.98); }
    .btn-secondary { background: var(--primary-light); }
    .status-badge { padding: 4px 8px; border-radius: 6px; font-size: 13px; font-weight: bold; }
    .badge-success { background: #d4edda; color: #155724; }
    .badge-danger { background: #f8d7da; color: #721c24; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { padding: 12px 8px; text-align: left; border-bottom: 1px solid #dee2e6; font-size: 15px; }
    th { background: #f8f9fa; color: #495057; }
    .empty-text { text-align: center; color: #888; padding: 20px; }
  </style>
</head>
<body>

<div class="container">
  <h1>🌱 สวนพร้อม (Suan-Prom)</h1>

  <!-- 1. การเชื่อมต่อ Supabase -->
  <div class="card" id="settingsCard">
    <h2>🔌 เชื่อมต่อ Supabase</h2>
    <div class="form-row">
      <div class="form-group">
        <label>Project URL</label>
        <input type="text" id="sbUrl" placeholder="https://xxxx.supabase.co">
      </div>
      <div class="form-group">
        <label>Publishable Key</label>
        <input type="password" id="sbKey" placeholder="anon key">
      </div>
    </div>
    <button class="btn" onclick="saveAndConnect()">เชื่อมต่อฐานข้อมูล</button>
  </div>

  <!-- 2. เลือกหรือสร้างร้านค้า -->
  <div class="card">
    <h2>🏡 ข้อมูลร้านค้า</h2>
    <div class="form-row">
      <div class="form-group" style="flex: 2;">
        <label>เลือกร้านค้าที่ใช้งาน</label>
        <select id="shopSelect" onchange="switchShop()">
          <option value="">-- กำลังโหลดร้านค้า... --</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>สร้างร้านค้าใหม่</label>
        <input type="text" id="newShopName" placeholder="พิมพ์ชื่อสวน / ชื่อร้านใหม่">
      </div>
      <div class="form-group" style="align-self: flex-end;">
        <button class="btn btn-secondary" onclick="createNewShop()">+ สร้างร้าน</button>
      </div>
    </div>
  </div>

  <!-- 3. เพิ่มสินค้าใหม่ -->
  <div class="card">
    <h2>📦 เพิ่มสินค้า / ต้นกล้าใหม่</h2>
    <div class="form-row">
      <div class="form-group" style="flex: 2;">
        <label>ชื่อต้นกล้า / สินค้า</label>
        <input type="text" id="pName" placeholder="เช่น กล้าพริกขี้หนู, เมล็ดมะเขือ">
      </div>
      <div class="form-group">
        <label>ประเภท</label>
        <input type="text" id="pType" value="ต้นกล้า">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>หน่วยนับ</label>
        <input type="text" id="pUnit" value="ต้น">
      </div>
      <div class="form-group">
        <label>ราคาขาย (บาท)</label>
        <input type="number" id="pPrice" placeholder="เช่น 15">
      </div>
      <div class="form-group">
        <label>ต้นทุน (บาท)</label>
        <input type="number" id="pCost" placeholder="เช่น 7">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>จำนวนสต็อกตั้งต้น</label>
        <input type="number" id="pStock" value="0">
      </div>
      <div class="form-group">
        <label>เตือนสต็อกต่ำเมื่อเหลือน้อยกว่า</label>
        <input type="number" id="pLowStock" value="20">
      </div>
    </div>
    <button class="btn" onclick="addNewProduct()">บันทึกเพิ่มสินค้า</button>
  </div>

  <!-- 4. รายการสินค้าและสต็อกคงเหลือ -->
  <div class="card">
    <h2>📋 สต็อกสินค้าคงเหลือ</h2>
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>ชื่อสินค้า</th>
            <th>ประเภท</th>
            <th>ราคาขาย</th>
            <th>คงเหลือ</th>
            <th>สถานะ</th>
          </tr>
        </thead>
        <tbody id="productTableBody">
          <tr><td colspan="5" class="empty-text">กรุณาเลือกร้านค้าเพื่อดูสต็อก</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 5. เครื่องมือคำนวณถาดเพาะ -->
  <div class="card">
    <h2>🔢 คำนวณจำนวนต้นกล้า</h2>
    <div class="form-row">
      <div class="form-group">
        <label>จำนวนถาดเพาะ (ถาด)</label>
        <input type="number" id="calcTray" value="10" oninput="runCalculator()">
      </div>
      <div class="form-group">
        <label>หลุมต่อถาด (หลุม)</label>
        <input type="number" id="calcHole" value="104" oninput="runCalculator()">
      </div>
    </div>
    <div id="calcOutput" style="font-weight: bold; text-align: center; color: var(--primary);">รวมประมาณ: 1,040 ต้น</div>
  </div>
</div>

<script>
  let sb = null;
  let activeShopId = null;

  window.onload = function() {
    const url = localStorage.getItem('sp_sb_url');
    const key = localStorage.getItem('sp_sb_key');
    if (url && key) {
      document.getElementById('sbUrl').value = url;
      document.getElementById('sbKey').value = key;
      initSupabase(url, key);
    }
    runCalculator();
  };

  function initSupabase(url, key) {
    try {
      sb = supabase.createClient(url, key);
      loadShops();
    } catch (e) {
      alert('เชื่อมต่อไม่สำเร็จ: ' + e.message);
    }
  }

  function saveAndConnect() {
    const url = document.getElementById('sbUrl').value.trim();
    const key = document.getElementById('sbKey').value.trim();
    if (!url || !key) {
      alert('กรุณากรอก URL และ Key');
      return;
    }
    localStorage.setItem('sp_sb_url', url);
    localStorage.setItem('sp_sb_key', key);
    initSupabase(url, key);
    alert('บันทึกการตั้งค่าแล้ว');
  }

  async function loadShops() {
    if (!sb) return;
    const { data, error } = await sb.from('shops').select('id, name').order('created_at', { ascending: false });
    const select = document.getElementById('shopSelect');
    select.innerHTML = '';

    if (error || !data || data.length === 0) {
      select.innerHTML = '<option value="">-- ยังไม่มีร้านค้า (กรุณาสร้างร้าน) --</option>';
      activeShopId = null;
      loadProducts();
      return;
    }

    data.forEach(shop => {
      const opt = document.createElement('option');
      opt.value = shop.id;
      opt.textContent = shop.name;
      select.appendChild(opt);
    });

    const savedShop = localStorage.getItem('sp_active_shop');
    if (savedShop && data.some(s => s.id === savedShop)) {
      select.value = savedShop;
      activeShopId = savedShop;
    } else {
      activeShopId = data[0].id;
      select.value = activeShopId;
    }
    loadProducts();
  }

  async function createNewShop() {
    if (!sb) return alert('กรุณาเชื่อมต่อ Supabase ก่อน');
    const name = document.getElementById('newShopName').value.trim();
    if (!name) return alert('กรุณาพิมพ์ชื่อร้าน');

    const { data, error } = await sb.from('shops').insert([{ name }]).select().single();
    if (error) {
      alert('สร้างร้านไม่สำเร็จ: ' + error.message);
      return;
    }

    document.getElementById('newShopName').value = '';
    alert('สร้างร้าน ' + name + ' สำเร็จ!');
    localStorage.setItem('sp_active_shop', data.id);
    loadShops();
  }

  function switchShop() {
    activeShopId = document.getElementById('shopSelect').value;
    localStorage.setItem('sp_active_shop', activeShopId);
    loadProducts();
  }

  async function loadProducts() {
    const tbody = document.getElementById('productTableBody');
    if (!sb || !activeShopId) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty-text">กรุณาเลือกร้านค้า</td></tr>';
      return;
    }

    const { data, error } = await sb.from('products').select('*').eq('shop_id', activeShopId).order('id', { ascending: false });
    if (error) {
      tbody.innerHTML = `<tr><td colspan="5" class="empty-text">เกิดข้อผิดพลาด: ${error.message}</td></tr>`;
      return;
    }

    if (!data || data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty-text">ยังไม่มีสินค้าในร้านนี้</td></tr>';
      return;
    }

    tbody.innerHTML = '';
    data.forEach(p => {
      const isLow = p.stock <= (p.low_stock_at || 0);
      const row = `
        <tr>
          <td><strong>${p.name}</strong></td>
          <td>${p.type || '-'}</td>
          <td>${Number(p.price).toLocaleString()} บ.</td>
          <td><strong>${p.stock}</strong> ${p.unit || ''}</td>
          <td>
            <span class="status-badge ${isLow ? 'badge-danger' : 'badge-success'}">
              ${isLow ? 'สต็อกต่ำ' : 'ปกติ'}
            </span>
          </td>
        </tr>
      `;
      tbody.innerHTML += row;
    });
  }

  async function addNewProduct() {
    if (!sb) return alert('กรุณาเชื่อมต่อ Supabase ก่อน');
    if (!activeShopId) return alert('กรุณาเลือกร้านค้าก่อนเพิ่มสินค้า');

    const name = document.getElementById('pName').value.trim();
    const type = document.getElementById('pType').value.trim();
    const unit = document.getElementById('pUnit').value.trim();
    const price = parseFloat(document.getElementById('pPrice').value) || 0;
    const cost = parseFloat(document.getElementById('pCost').value) || 0;
    const stock = parseInt(document.getElementById('pStock').value) || 0;
    const low_stock_at = parseInt(document.getElementById('pLowStock').value) || 0;

    if (!name) return alert('กรุณาใส่ชื่อสินค้า');

    const newProd = {
      shop_id: activeShopId,
      name,
      type,
      unit,
      price,
      cost,
      stock,
      low_stock_at,
      active: true
    };

    const { error } = await sb.from('products').insert([newProd]);
    if (error) {
      alert('บันทึกสินค้าไม่สำเร็จ: ' + error.message);
      return;
    }

    alert('เพิ่มสินค้าเรียบร้อย!');
    document.getElementById('pName').value = '';
    document.getElementById('pPrice').value = '';
    document.getElementById('pCost').value = '';
    document.getElementById('pStock').value = '0';
    loadProducts();
  }

  function runCalculator() {
    const trays = parseFloat(document.getElementById('calcTray').value) || 0;
    const holes = parseFloat(document.getElementById('calcHole').value) || 0;
    document.getElementById('calcOutput').innerText = `รวมประมาณ: ${(trays * holes).toLocaleString()} ต้น`;
  }
</script>
</body>
</html>
